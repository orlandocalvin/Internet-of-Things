<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESP Firebase Dashboard</title>
    <script src="app.js" type="module"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>ESP Firebase Realtime Dashboard</h1>
    <div class="card">
        <div class="label">Integer</div>
        <div id="reading-int" class="value">--</div>
    </div>
    <div class="card">
        <div class="label">Float</div>
        <div id="reading-float" class="value">--</div>
    </div>
    <div class="card">
        <div class="label">String</div>
        <div id="reading-string" class="value">--</div>
    </div>
</body>

</html>
