<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESP IoT Firebase App</title>

    <!-- Icons & Styles -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css" crossorigin="anonymous" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="style.css" />

    <!-- Scripts -->
    <script type="module" src="scripts/auth.js"></script>
    <script type="module" src="scripts/index.js"></script>
</head>

<body>
    <!-- TOP BAR -->
    <header class="topnav">
        <h1>Sensor Readings App <i class="fas fa-clipboard-list"></i></h1>
    </header>

    <main>
        <!-- AUTH BAR -->
        <div id="authentication-bar" class="hidden">
            <p>
                <span id="authentication-status">User logged in</span>
                <span id="user-details">USEREMAIL</span>
                <a href="#" id="logout-link">(logout)</a>
            </p>
        </div>

        <!-- LOGIN FORM -->
        <form id="login-form" class="hidden">
            <div class="form-elements-container">
                <label for="input-email"><b>Email</b></label>
                <input type="text" placeholder="Enter Email" id="input-email" required />

                <label for="input-password"><b>Password</b></label>
                <input type="password" placeholder="Enter Password" id="input-password" required />

                <button type="submit" id="login-button">Login</button>
                <p id="error-message" class="error-text"></p>
            </div>
        </form>

        <!-- SENSOR DATA CONTENT -->
        <section id="content-sign-in" class="content hidden">
            <div class="cards">
                <!-- Temperature -->
                <div class="card">
                    <p><i class="fas fa-thermometer-half" style="color:#059e8a;"></i> TEMPERATURE</p>
                    <p class="reading"><span id="temp">--</span> °C</p>
                </div>
                <!-- Humidity -->
                <div class="card">
                    <p><i class="fas fa-tint" style="color:#00add6;"></i> HUMIDITY</p>
                    <p class="reading"><span id="hum">--</span> %</p>
                </div>
                <!-- Pressure -->
                <div class="card">
                    <p><i class="fas fa-angle-double-down" style="color:#e1e437;"></i> PRESSURE</p>
                    <p class="reading"><span id="pres">--</span> hPa</p>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
